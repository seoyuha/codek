<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>CODE K : 한국의 비밀을 찾아라</title>
<link href="fonts/noto-sans-kr.css" rel="stylesheet">
<link href="fonts/black-han-sans.css" rel="stylesheet">
<style>
:root{
  --navy:#070c16; --navy2:#0d1626; --panel:rgba(8,13,24,.94); --line:#c9a45a; --line2:#8a6d33;
  --gold:#f3cf74; --gold2:#d3a443; --goldtxt:#ffe2a0; --txt:#f3f1ea; --muted:#a9b0c0;
  --blue:#2f8dff; --blue2:#123a78; --blueglow:#3aa0ff; --red:#ff3b4a; --red2:#6d1018; --redglow:#ff4d5a;
  --neutral:#8d93a3; --goblin:#9b4dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700;color:var(--txt);user-select:none;-webkit-user-select:none}
button{font-family:inherit;font-weight:700;cursor:pointer;border:none;color:inherit;background:none;padding:0}
input,select{font-family:inherit;font-weight:700}
.hidden{display:none!important}
.bhs{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}

/* ================= 무대 (1672×941 시안 좌표 그대로) ================= */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#backdrop{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(22px) brightness(.45);transition:background-image .3s}
#stage{position:relative;width:1672px;height:941px;flex:none;transform-origin:center center;overflow:hidden;background:#05080f}
.scr{position:absolute;inset:0;display:none;background-size:100% 100%;background-repeat:no-repeat}
.scr.on{display:block}
.abs{position:absolute}
/* 그림에 그려진 버튼 위에 얹는 투명 버튼 */
.hs{position:absolute;border-radius:12px;transition:background .15s,box-shadow .15s,transform .08s}
.hs:hover{background:rgba(255,226,150,.10);box-shadow:0 0 0 2px rgba(255,214,120,.55),0 0 24px rgba(255,200,90,.35)}
.hs:active{background:rgba(0,0,0,.22);transform:scale(.985)}
.hs.muted::after{content:'';position:absolute;left:18%;right:18%;top:50%;height:5px;margin-top:-2px;background:#ff4d5a;border-radius:3px;transform:rotate(-40deg);box-shadow:0 0 6px #000}

/* 공통 패널·버튼 */
.gpanel{background:linear-gradient(180deg,rgba(14,22,38,.97),rgba(6,10,18,.97));border:2px solid var(--line);border-radius:14px;
  box-shadow:0 0 0 1px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,220,140,.12),0 16px 40px rgba(0,0,0,.7)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:64px;padding:0 28px;border-radius:10px;font-size:26px;font-weight:900;
  color:#1d1407;background:linear-gradient(180deg,#ffe9a8 0%,#f2c75e 45%,#d29c35 100%);border:2px solid #fff0c4;
  box-shadow:0 0 0 2px #7a5a1e,0 6px 18px rgba(0,0,0,.6),inset 0 -4px 0 rgba(120,80,20,.35);transition:filter .15s,transform .08s;white-space:nowrap}
.gbtn:hover{filter:brightness(1.08)} .gbtn:active{transform:translateY(2px)}
.gbtn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.dbtn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:10px;font-size:26px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#1b2333,#0a0f18);border:2px solid #b9c2d3;box-shadow:0 0 0 2px #000,0 8px 20px rgba(0,0,0,.6),inset 0 0 18px rgba(255,255,255,.06);transition:filter .15s,transform .08s;white-space:nowrap}
.dbtn:hover{filter:brightness(1.2)} .dbtn:active{transform:translateY(2px)}
.dbtn.goldb{border-color:var(--gold);color:var(--goldtxt)}
.dbtn.blueb{background:linear-gradient(180deg,#1f5fc4,#0b2b66);border-color:#7cc0ff;box-shadow:0 0 0 2px #000,0 0 22px rgba(58,160,255,.55)}
.dbtn.redb{background:linear-gradient(180deg,#b3202c,#4d0910);border-color:#ff9aa2;box-shadow:0 0 0 2px #000,0 0 22px rgba(255,77,90,.55)}
.dbtn:disabled{opacity:.5;cursor:not-allowed}
.dots::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* ================= 입장 화면 ================= */
.join-msg{left:560px;top:398px;width:560px;height:64px;display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1.4;text-align:center;color:#fff;text-shadow:0 2px 4px #000}
.join-msg b{color:var(--gold)}
.codebox{position:absolute;top:468px;width:78px;height:77px;background:transparent;border:none;outline:none;text-align:center;font-family:'Black Han Sans';font-size:46px;color:var(--gold);caret-color:var(--gold);border-radius:12px;text-shadow:0 0 12px rgba(255,200,90,.6)}
.codebox:focus{box-shadow:0 0 0 3px rgba(255,214,120,.9),0 0 22px rgba(255,200,90,.6);background:rgba(255,214,120,.06)}
.namebox{left:577px;top:468px;width:520px;height:77px;border-radius:12px;background:#0a1018;border:3px solid #e8cf8e;box-shadow:0 0 18px rgba(255,200,90,.35);display:flex;align-items:center;padding:0 16px;gap:12px}
.namebox input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:#fff;font-size:34px;text-align:center;font-weight:900}
.namebox input::placeholder{color:#6b7385;font-weight:700}
.namebox .back{font-size:16px;color:var(--muted);white-space:nowrap}
.join-err{left:560px;top:640px;width:560px;text-align:center}
.join-err span{display:inline-block;background:rgba(80,8,14,.92);border:2px solid #ff8a93;color:#fff;border-radius:10px;padding:6px 16px;font-size:19px}

/* ================= 대기실 ================= */
.slot{position:absolute;width:104px;height:114px;border-radius:8px;overflow:hidden;border:2px solid;background:#0b1526;animation:pop .35s ease-out}
.slot.blue{border-color:#5fb4ff;box-shadow:0 0 14px rgba(58,160,255,.7)} .slot.red{border-color:#ff7b86;box-shadow:0 0 14px rgba(255,77,90,.7)}
.slot img{display:block;width:100%;height:86px;object-fit:cover}
.slot .nm{position:absolute;left:0;right:0;bottom:0;height:28px;background:#060a12;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.slot .tag{position:absolute;left:4px;top:4px;font-size:12px;background:var(--gold);color:#241800;border-radius:6px;padding:1px 6px;font-weight:900;box-shadow:0 1px 3px #000}
.slot.me .nm{color:var(--gold)}
.slot.off{filter:grayscale(.9) brightness(.6)}
.slot.ai img{object-fit:contain;padding:8px;background:radial-gradient(#22324d,#0a1220)}
.tcount{font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:flex-end;gap:8px;text-shadow:0 0 10px rgba(0,0,0,.8)}
.tcount.blue{color:#cfe6ff} .tcount.red{color:#ffd4d8}
.wait-center{left:650px;top:472px;width:382px;height:202px;background:rgba(6,10,18,.93);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:10px}
.wait-center .t1{font-size:22px;color:var(--gold)} .wait-center .t2{font-size:19px;line-height:1.5;color:#fff}
.wait-center .gbtn{height:52px;font-size:21px;padding:0 22px}
.mychip{position:absolute;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;background:rgba(5,9,16,.88);border:2px solid var(--line);border-radius:40px;font-size:19px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.6);white-space:nowrap}
.mychip img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.mychip b{color:var(--gold);font-size:24px}
.mychip .sep{width:1px;height:26px;background:#5b4a28}

/* ================= 게임 화면 ================= */
.topbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.topbox .l{font-size:18px;color:#e9e2cf}
.topbox .v{font-family:'Black Han Sans';font-size:46px;line-height:1.05;text-shadow:0 0 14px rgba(255,255,255,.35)}
.topbox .v.small{font-size:32px}
.topbox .v.warn{color:#ff6b75;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.tglow{position:absolute;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .3s}
.tglow.on{opacity:1;animation:tg 1.2s ease-in-out infinite alternate}
.tglow.blue{box-shadow:0 0 0 4px #7fd0ff,0 0 40px 10px rgba(58,160,255,.9)} .tglow.red{box-shadow:0 0 0 4px #ff9aa2,0 0 40px 10px rgba(255,77,90,.9)}
@keyframes tg{from{filter:brightness(.8)}to{filter:brightness(1.3)}}
.turnflag{position:absolute;font-size:17px;font-weight:900;padding:3px 12px;border-radius:20px;background:var(--gold);color:#241800;box-shadow:0 0 14px rgba(255,210,100,.8);white-space:nowrap}
.pcount{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;color:#fff}
.pcount .n{font-family:'Black Han Sans';font-size:50px;line-height:1;text-shadow:0 0 16px rgba(255,255,255,.55)}
.pcount .u{font-size:20px} .pcount .lb{font-size:15px;color:#cfd6e6;margin-right:4px}
.ava{position:absolute;width:68px;height:65px;border-radius:6px;overflow:hidden;border:2px solid}
.ava.blue{border-color:#62b7ff} .ava.red{border-color:#ff8a93}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.empty{background:#0a1220;border-color:#2a3b58;display:flex;align-items:center;justify-content:center;color:#3f5577;font-size:28px}
.ava.red.empty{background:#1c0a0e;border-color:#5a2028;color:#6e2a33}
.ava.off img{filter:grayscale(1) brightness(.5)}
.ava.ai img{object-fit:contain;padding:6px;background:#0b1424}
.pname{position:absolute;display:flex;flex-direction:column;justify-content:center;color:#fff;font-size:22px;line-height:1.15;white-space:nowrap;overflow:hidden}
.pname small{font-size:14px;color:#cdd5e5}
.pname small.spy{color:var(--gold)}
.pname.me{color:var(--gold)}
.pname.off{opacity:.45}

.kcard{position:absolute;border-radius:6px;overflow:hidden;background:#000;border:3px solid #c9a45a;
  box-shadow:0 0 0 1px #000,0 6px 14px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,230,160,.3);transition:transform .12s,box-shadow .2s,filter .2s}
.kcard>img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.kcard .lbl{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 4px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.82) 45%);text-align:center;pointer-events:none}
.kcard .en{font-size:21px;font-weight:900;color:#fff;line-height:1.05;text-shadow:0 2px 3px #000;letter-spacing:.2px}
.kcard .ko{font-size:13px;color:#e6dcc4;line-height:1.1}
.kcard.can{cursor:pointer}
.kcard.can:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 0 2px #fff1c4,0 0 26px rgba(255,214,120,.8)}
.kcard.voted{border-color:#fff1a8;animation:vglow .8s ease-in-out infinite alternate}
@keyframes vglow{from{box-shadow:0 0 0 2px #ffcf3f,0 0 16px rgba(255,207,63,.7)}to{box-shadow:0 0 0 5px #ffcf3f,0 0 34px rgba(255,207,63,1)}}
.kcard .pins{position:absolute;top:4px;right:4px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.kcard .pin{background:var(--gold);color:#241800;border-radius:6px;font-size:13px;padding:0 6px;box-shadow:0 1px 4px #000}
/* 힌트 담당이 보는 색 */
.kcard.k-blue{border-color:#55b0ff;box-shadow:0 0 0 1px #000,0 0 16px rgba(58,160,255,.85)}
.kcard.k-red{border-color:#ff6a77;box-shadow:0 0 0 1px #000,0 0 16px rgba(255,77,90,.85)}
.kcard.k-neutral{border-color:#b9bfcc}
.kcard.k-assassin{border-color:#b77bff;box-shadow:0 0 0 1px #000,0 0 18px rgba(155,77,255,.95)}
.kcard .badge{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:50%;box-shadow:0 2px 6px #000}
.kcard.match{animation:mglow .9s ease-in-out infinite alternate}
@keyframes mglow{from{transform:translateY(0)}to{transform:translateY(-5px);filter:brightness(1.25)}}
/* 열린 카드 */
.kcard .cover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.kcard.open .cover{display:flex;animation:flip .5s ease-out}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.kcard.open.c-blue{border-color:#7cc8ff} .kcard.open.c-blue .cover{background:linear-gradient(160deg,rgba(30,110,230,.86),rgba(8,30,80,.92))}
.kcard.open.c-red{border-color:#ff8f99} .kcard.open.c-red .cover{background:linear-gradient(160deg,rgba(220,40,55,.86),rgba(70,6,14,.92))}
.kcard.open.c-neutral{border-color:#c5cad5} .kcard.open.c-neutral .cover{background:linear-gradient(160deg,rgba(110,116,130,.88),rgba(30,33,42,.93))}
.kcard.open.c-assassin{border-color:#c79bff} .kcard.open.c-assassin .cover{background:linear-gradient(160deg,rgba(120,40,220,.7),rgba(30,6,60,.9))}
.kcard .cover img{width:66px;height:66px;border-radius:50%;box-shadow:0 0 16px rgba(0,0,0,.7)}
.kcard .cover .cw{font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 3px #000}
.board.over .kcard:not(.open){filter:brightness(.82)}
.board.peek .kcard.open .cover{opacity:.25}
.board.peek .kcard{filter:none!important}

.msgbox{left:618px;top:800px;width:438px;height:82px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;color:#fff;line-height:1.35;padding:0 10px}
.msgbox b{color:var(--gold)} .msgbox>div{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap} .msgbox>div.txt{display:block}
.hintword{display:inline-flex;align-items:center;gap:10px}
.hintword .w{font-family:'Black Han Sans';font-size:44px;letter-spacing:1px;color:#fff;text-transform:uppercase;text-shadow:0 0 18px rgba(255,214,120,.8)}
.hintword .num{font-family:'Black Han Sans';font-size:34px;min-width:50px;height:50px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#241800;background:linear-gradient(180deg,#ffe9a8,#d29c35);border:2px solid #fff0c4}
.hintword .ko{font-size:16px;color:#cfd6e6}
.spk{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#ffe9a8,#d29c35);color:#241800;font-size:20px;border:2px solid #fff0c4}
.tagteam{font-size:15px;padding:2px 10px;border-radius:14px;color:#fff;white-space:nowrap}
.tagteam.blue{background:#1d63d6} .tagteam.red{background:#c41e2e}
.actbox{left:1074px;top:798px;width:240px;height:88px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px}
.actbox .dbtn,.actbox .gbtn{height:56px;font-size:20px;padding:0 12px}
.actbox .note{font-size:15px;color:#e8e2d0;text-align:center;background:rgba(5,9,16,.85);border-radius:10px;padding:6px 8px;border:1px solid #5b4a28}

/* 힌트 고르기 */
.hintpad{left:340px;top:200px;width:996px;height:590px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;z-index:30}
.hintpad h3{margin:0;font-size:26px;color:var(--gold);display:flex;align-items:center;gap:12px}
.hintpad h3 small{font-size:16px;color:var(--muted)}
.hp-groups{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.hp-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hp-row .gl{width:82px;font-size:16px;color:var(--gold2);text-align:right;margin-right:4px}
.hchip{background:linear-gradient(180deg,#1a2436,#0c121d);border:2px solid #4b5a77;border-radius:10px;padding:4px 11px;font-size:19px;display:flex;flex-direction:column;align-items:center;line-height:1.1;color:#fff}
.hchip small{font-size:12px;color:#aab3c6}
.hchip .cnt{font-size:11px;color:#7cc0ff}
.hchip:hover{border-color:var(--gold)}
.hchip.sel{background:linear-gradient(180deg,#ffe9a8,#d29c35);border-color:#fff0c4;color:#241800}
.hchip.sel small,.hchip.sel .cnt{color:#4d3a10}
.hp-bottom{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px}
.numbtn{width:58px;height:58px;font-family:'Black Han Sans';font-size:30px;border-radius:10px;background:linear-gradient(180deg,#1a2436,#0c121d);border:2px solid #4b5a77;color:#fff}
.numbtn.sel{background:linear-gradient(180deg,#ffe9a8,#d29c35);color:#241800;border-color:#fff0c4}

/* 팝업 공통 */
.pop-layer{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center}
.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.reveal-pop{width:640px;padding:22px 26px;text-align:center}
.reveal-pop .ph{width:420px;height:280px;object-fit:cover;border-radius:10px;border:3px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.7)}
.reveal-pop.blue{border-color:#7cc8ff;box-shadow:0 0 0 1px #000,0 0 50px rgba(58,160,255,.8)}
.reveal-pop.red{border-color:#ff8f99;box-shadow:0 0 0 1px #000,0 0 50px rgba(255,77,90,.8)}
.reveal-pop .w{font-size:40px;font-weight:900;margin-top:10px}
.reveal-pop .w small{font-size:22px;color:var(--muted);margin-left:8px}
.reveal-pop .q{font-size:26px;color:var(--gold);margin:6px 0 2px}
.reveal-pop .a{font-size:22px;margin:4px 0 14px;color:#fff;line-height:1.4}
.res{display:inline-flex;align-items:center;gap:10px;font-size:24px;padding:8px 22px;border-radius:12px;color:#fff;border:2px solid rgba(255,255,255,.6)}
.res img{width:42px;height:42px;border-radius:50%}
.res.hit{background:linear-gradient(180deg,#2fbf62,#136b33)} .res.enemy{background:linear-gradient(180deg,#e58a2f,#8a4510)}
.res.neutral{background:linear-gradient(180deg,#7d8496,#3a3f4c)} .res.assassin{background:linear-gradient(180deg,#9b4dff,#3d1270)}
.reveal-pop .by{margin-top:10px;color:var(--muted);font-size:17px}

/* 승리·패배 화면 */
#endLayer{position:absolute;inset:0;z-index:40;background-size:100% 100%;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.end-row{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:14px;background:#060a13;border:2px solid}
.end-row.blue{border-color:#5fb4ff;box-shadow:0 0 26px rgba(58,160,255,.6)} .end-row.red{border-color:#ff7b86;box-shadow:0 0 26px rgba(255,77,90,.6)}
.etile{width:136px;height:146px;border-radius:10px;overflow:hidden;position:relative;border:2px solid #fff3}
.etile img{width:100%;height:112px;object-fit:cover;display:block}
.etile .nm{height:34px;background:#060a12;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.etile.me .nm{color:var(--gold)}
.etile .tag{position:absolute;left:5px;top:5px;font-size:13px;background:var(--gold);color:#241800;border-radius:6px;padding:1px 7px;font-weight:900}
.score-panel{position:absolute;left:348px;top:642px;width:972px;height:190px;display:flex;gap:12px;padding:12px;border-radius:12px;background:rgba(5,9,17,.96);border:2px solid var(--line);box-shadow:0 0 0 1px #000,0 0 30px rgba(255,200,90,.25)}
.sp-side{width:260px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 14px}
.sp-side img{width:110px;height:110px;border-radius:50%}
.sp-side.blue{background:linear-gradient(160deg,#0f2f66,#06142e);border:2px solid #3f8fe6} .sp-side.red{background:linear-gradient(160deg,#5c0d16,#22050a);border:2px solid #d94452}
.sp-side .tn{font-size:22px} .sp-side .big{font-family:'Black Han Sans';font-size:56px;line-height:1}
.sp-side .big small{font-size:24px;font-family:'Noto Sans KR';font-weight:900}
.sp-side.win{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(255,210,100,.7)}
.sp-table{flex:1;border-collapse:collapse;font-size:19px;color:#fff}
.sp-table td,.sp-table th{border-bottom:1px solid #2b3a55;padding:4px 8px;text-align:center}
.sp-table th{font-size:16px;color:#cfd6e6;font-weight:700}
.sp-table td:first-child{text-align:left;color:#e7e1cf}
.sp-table .cb{color:#7cc8ff} .sp-table .cr{color:#ff8f99}

// ---------- 소리 (CODE K 오리지널 사운드, 잔잔한 음량) ----------
// 음량: 배경음악 10%, 효과음 30% 정도. 아이패드도 음량이 지켜지도록 Web Audio로 재생해요.
const VOL = { bgm: 0.10, sfx: 0.30, duck: 0.035 };
const SFX_GAIN = { click:.55, hover:.4, confirm:.8, cancel:.8, join:.8, start:.8, select:.7, blue:.9, red:.9, neutral:.9, hint:.9, timer:.7, goblin:.6, victory:.75, defeat:.6, notify:.9, countdown:.8 };
const OLD2NEW = { tap:'click', turn:'notify', hint:'hint', win:'victory', boom:'goblin', bad:'cancel', hit:'confirm' };
let bgmOn = LS.get('codek_bgm') !== false;
const AU = { ctx:null, buf:{}, loading:{}, bgmGain:null, sfxGain:null, bgmSrc:null, bgmName:null, want:null };
function auInit(){
  if(AU.ctx) { if(AU.ctx.state==='suspended') AU.ctx.resume(); return true; }
  try{
    AU.ctx = new (window.AudioContext||window.webkitAudioContext)();
    AU.bgmGain = AU.ctx.createGain(); AU.bgmGain.gain.value = 0; AU.bgmGain.connect(AU.ctx.destination);
    AU.sfxGain = AU.ctx.createGain(); AU.sfxGain.gain.value = VOL.sfx; AU.sfxGain.connect(AU.ctx.destination);
    ['click','select','confirm','hint','blue','red','neutral','notify'].forEach(loadSnd);
    if(AU.want) playBgm(AU.want);
    return true;
  }catch(e){ return false; }
}
function loadSnd(name){
  const key = name.startsWith('bgm_') ? name : 'sfx_'+name;
  if(AU.buf[key]) return Promise.resolve(AU.buf[key]);
  if(AU.loading[key]) return AU.loading[key];
  return AU.loading[key] = fetch('assets/sound/'+key+'.mp3').then(r=>r.arrayBuffer())
    .then(ab=>new Promise((ok,no)=>AU.ctx.decodeAudioData(ab,ok,no)))
    .then(b=>AU.buf[key]=b).catch(()=>null);
}
function sfx(name){
  if(!sound || !AU.ctx) return;
  loadSnd(name).then(b=>{
    if(!b) return;
    const src=AU.ctx.createBufferSource(), g=AU.ctx.createGain();
    g.gain.value = SFX_GAIN[name] ?? .8; src.buffer=b; src.connect(g).connect(AU.sfxGain); src.start();
  });
}
function beep(type){ sfx(OLD2NEW[type] || type); }
function bgmLevel(){ return (sound && bgmOn) ? VOL.bgm : 0; }
function playBgm(name){
  AU.want = name;
  if(!AU.ctx || AU.bgmName===name) return;
  AU.bgmName = name;
  const g=AU.bgmGain, t=AU.ctx.currentTime;
  const old=AU.bgmSrc; AU.bgmSrc=null;
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+.6);
  if(old) try{ old.stop(t+.65); }catch(e){}
  loadSnd('bgm_'+name).then(b=>{
    if(!b || AU.bgmName!==name) return;
    const src=AU.ctx.createBufferSource(); src.buffer=b; src.loop=true; src.connect(AU.bgmGain);
    const t2=Math.max(AU.ctx.currentTime, t+.65); src.start(t2); AU.bgmSrc=src;
    AU.bgmGain.gain.setValueAtTime(0,t2); AU.bgmGain.gain.linearRampToValueAtTime(bgmLevel(), t2+1.2);
  });
}
function setBgmVolume(v, sec=.4){ if(!AU.ctx) return; const t=AU.ctx.currentTime, g=AU.bgmGain.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(v,t+sec); }
function refreshBgm(){ setBgmVolume(bgmLevel()); }
// 첫 터치·클릭 때 소리 켜기 (브라우저 자동재생 제한)
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, auInit, { capture:true, passive:true }));

document.addEventListener('pointerover', e=>{ if(e.pointerType!=='mouse') return; const b=e.target.closest('.hs,.gbtn,.dbtn,.cbtn'); if(b && b!==sfx._last){ sfx._last=b; sfx('hover'); } });
document.addEventListener('pointerout', e=>{ if(!e.relatedTarget || !sfx._last?.contains(e.relatedTarget)) sfx._last=null; });
function syncSound(){ $$('.sound-hs').forEach(b=>b.classList.toggle('muted', !sound)); }
function toggleSound(){ sound=!sound; LS.set('codek_sound',sound); syncSound(); refreshBgm(); if(!sound) try{speechSynthesis.cancel()}catch(e){}; toast(sound?'🔊 소리를 켰어요':'🔇 소리를 껐어요',1400); }
syncSound();
let voice=null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
    const pref = [/Google US English/i,/Natural/i,/Samantha/i,/Aria/i,/Jenny/i,/Ava/i,/Allison/i,/Google UK English Female/i,/en-US/i];
    for(const p of pref){ const v = vs.find(v=>p.test(v.name)||p.test(v.lang)); if(v){ voice=v; return; } }
    voice = vs[0]||null;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(text, rate=.9){
  if(!sound) return;
  try{ const u=new SpeechSynthesisUtterance(text); if(voice) u.voice=voice; u.lang=voice?voice.lang:'en-US'; u.rate=rate; u.onstart=()=>setBgmVolume(Math.min(bgmLevel(),VOL.duck),.25); u.onend=u.onerror=()=>{ if(!speechSynthesis.speaking) refreshBgm(); }; speechSynthesis.speak(u); }catch(e){}
}

let joinStep='code', joinCode='';
$('#codeBoxes').innerHTML = [577,665,754,842,931,1019].map((x,i)=>`<input class="codebox" data-i="${i}" inputmode="numeric" maxlength="1" autocomplete="off" style="left:${x}px">`).join('');
const boxes = $$('.codebox');
function focusCode(i){ setTimeout(()=>boxes[Math.max(0,Math.min(5,i))].focus(),30); }
boxes.forEach((b,i)=>{
  b.addEventListener('input', ()=>{
    const v=b.value.replace(/\D/g,'');
    if(v.length>1){ fillCode(v); return; }
    b.value=v; if(v && i<5) boxes[i+1].focus();
    if(codeVal().length===6) submitJoin();
  });
  b.addEventListener('keydown', e=>{
    if(e.key==='Backspace' && !b.value && i>0){ boxes[i-1].value=''; boxes[i-1].focus(); e.preventDefault(); }
    if(e.key==='Enter') submitJoin();
  });
  b.addEventListener('paste', e=>{ e.preventDefault(); fillCode((e.clipboardData||window.clipboardData).getData('text')); });
});
function fillCode(t){ const d=String(t).replace(/\D/g,'').slice(0,6).split(''); boxes.forEach((b,i)=>b.value=d[i]||''); focusCode(d.length); if(d.length===6) submitJoin(); }
const codeVal = () => boxes.map(b=>b.value).join('');
function setJoinStep(st){
  joinStep=st; $('#jErr').innerHTML='';
  const nameMode = st==='name';
  $('#nameBox').classList.toggle('hidden', !nameMode);
  boxes.forEach(b=>b.classList.toggle('hidden', nameMode));
  $('#jMsg').innerHTML = '<div>' + (nameMode
    ? `교실 <b>${esc(joinCode)}</b>에 들어가요!<br><b>내 이름</b>을 입력하고 입장하기를 눌러 주세요.`
    : `게임에 참여하려면<br>선생님이 알려준 <b>6자리 입장 코드</b>를 입력하세요.`) + '</div>';
  if(nameMode) setTimeout(()=>$('#jName').focus(),30);
}
function joinErr(m){ $('#jErr').innerHTML=`<span>${esc(m)}</span>`; sfx('cancel'); }
function goJoin(){
  closePop(); show('join');
  if(session.mode==='student'&&session.sid){ rejoin(); return; }
  setJoinStep('code');
  if(session.code){ fillCode(session.code); if(session.name) $('#jName').value=session.name; } else focusCode(0);
}
function submitJoin(){
  if(joinStep==='code'){
    const code=codeVal();
    if(code.length!==6) return joinErr('입장 코드 6자리를 모두 입력해 주세요.');
    socket.emit('student:check',{code},res=>{
      if(!res.ok) return joinErr(res.err);
      joinCode=code; setJoinStep('name'); sfx('confirm');
    });
  } else {
    const name=$('#jName').value.trim();
    if(!name) return joinErr('이름을 입력해 주세요.');
    socket.emit('student:join',{code:joinCode,name},res=>{
      if(!res.ok) return joinErr(res.err);
      session={mode:'student',code:res.code,sid:res.sid,name:res.name}; LS.set('codek',session); sfx('join');
    });
  }
}
$('#jGo').onclick=()=>{ beep('tap'); submitJoin(); };

function rejoin(){

}

function renderGame(){
  const g=S.game;
  show('game');
  if(g.no!==lastSeq.no){
    const fresh = lastSeq.no!==-1;
    lastSeq={no:g.no, seq: fresh ? (g.events.find(e=>e.type==='start')||{seq:0}).seq-1 : Math.max(0,...g.events.map(e=>e.seq))};
    spyPick={w:null,n:null}; hintOpen=true; peek=false; hideEnd(); endShownFor=-1;
    if(g.phase!=='over') sfx('start');
  }
  endAt = g.remain!=null ? Date.now()+g.remain : null;
  nextAt = g.nextIn!=null ? Date.now()+g.nextIn : null;
  $('#gMy').innerHTML = myChip(g.me.team, myIndex(g)) + (g.me.team?`<span class="sep"></span><span class="tagteam ${g.me.team}">${g.me.team==='blue'?'파랑':'빨강'} ${g.me.role==='spy'?'🔑 힌트 담당':'🕵️ 요원'}</span>`:'<span class="sep"></span><span>👀 관전</span>');
  renderTop(g); renderPanels(g); renderBoard(g); renderMsg(g); renderActions(g);
  handleEvents(g);
  if(g.phase==='over') showEnd(g);
  tickTimer();
}

function renderTop(g){
  let l;
  if(g.phase==='guess') l=`<div class="l">남은 기회</div><div class="v">${g.guessesLeft}</div>`;
  else if(g.phase==='hint') l=`<div class="l">지금 차례</div><div class="v small" style="color:${g.turn==='blue'?'#7cc8ff':'#ff8f99'}">${g.turn==='blue'?'파랑':'빨강'}</div>`;
  else l=`<div class="l">남은 카드</div><div class="v small"><span style="color:#7cc8ff">${g.left.blue}</span> : <span style="color:#ff8f99">${g.left.red}</span></div>`;
  $('#gBoxL').innerHTML=l;
  $('#glowB').classList.toggle('on', g.phase!=='over' && g.turn==='blue');
  $('#glowR').classList.toggle('on', g.phase!=='over' && g.turn==='red');
}

function renderPanels(g){
  const out=[];
  ['blue','red'].forEach(t=>{
    const list=teamList(g,t);
    const ax = t==='blue'?42:1396, nx = t==='blue'?122:1474;
    ROWY.forEach((y,i)=>{
      const p=list[i];
      if(!p){ out.push(`<div class="ava ${t} empty" style="left:${ax}px;top:${y}px">·</div>`); return; }
      const off = !p.ai && !p.connected;
      out.push(`<div class="ava ${t} ${p.ai?'ai':''} ${off?'off':''}" style="left:${ax}px;top:${y}px"><img src="${p.ai?EMB[t]:avatar(t,i)}" alt=""></div>
        <div class="pname ${p.id===S.me.id?'me':''} ${off?'off':''}" style="${P(nx,y,158,65)}">${esc(p.name)}<small class="${p.spy?'spy':''}">${p.spy?'🔑 힌트 담당':'🕵️ 요원'}${off?' · 연결 끊김':''}</small></div>`);
    });
    if(list.length>4) out.push(`<div class="turnflag" style="left:${t==='blue'?200:1550}px;top:640px">+${list.length-4}명</div>`);
    $(t==='blue'?'#gCntB':'#gCntR').innerHTML=`<span class="lb">남은</span><span class="n">${g.left[t]}</span><span class="u">장</span>`;
  });
  if(g.phase!=='over') out.push(`<div class="turnflag" style="left:${g.turn==='blue'?110:1460}px;top:186px">▶ 지금 차례</div>`);
  if(g.start) out.push(`<div class="turnflag" style="left:${g.start==='blue'?30:1380}px;top:640px;background:#1b2333;color:#ffe2a0;box-shadow:none;border:1px solid #8a6d33">⭐ 먼저 시작</div>`);
  $('#gRows').innerHTML=out.join('');
}

function renderBoard(g){
  const me=g.me, board=$('#board');
  const canVote = g.phase==='guess' && me.role==='agent' && me.team===g.turn;
  const isSpy = me.role==='spy';
  board.className='board'+(g.phase==='over'?' over':'')+(peek?' peek':'');
  const myVote = g.cards.findIndex(c=>c.votes.includes(S.me.name));
  board.innerHTML = g.cards.map((c,k)=>{
    const col=k%5, row=Math.floor(k/5);
    const cls=['kcard'];
    if(c.revealed) cls.push('open','c-'+c.color);
    else if(c.color && (isSpy || g.phase==='over')) cls.push('k-'+c.color);
    if(!c.revealed && canVote) cls.push('can');
    if(c.i===myVote) cls.push('voted');
    if(isSpy && !c.revealed && spyPick.w && c.tags && c.tags.includes(spyPick.w)) cls.push('match');
    const badge = (!c.revealed && c.color && (isSpy||g.phase==='over')) ? `<img class="badge" src="${EMB[c.color]}" alt="">` : '';
    const cover = c.color==='assassin'
      ? `<img src="${EMB.assassin}" alt="" style="width:76px;height:76px"><div class="cw">${esc(c.en)} · 도깨비!</div>`
      : `<img src="${EMB[c.color]||EMB.neutral}" alt=""><div class="cw">${esc(c.en)}</div>`;
    return `<div class="${cls.join(' ')}" data-i="${c.i}" style="${P(COLS[col]-3, ROWS[row]-3, CW+6, CH[row]+6)}">
      <img class="ph" src="${cardImg(c)}" alt="">
      <div class="lbl"><div class="en">${esc(c.en)}</div><div class="ko">${esc(c.ko)}</div></div>${badge}
      <div class="cover">${c.revealed?cover:''}</div>
      <div class="pins">${c.votes.map(n=>`<span class="pin">${esc(n)}</span>`).join('')}</div>
    </div>`;
  }).join('');
  if(canVote) $$('#board .kcard.can').forEach(el=>el.onclick=()=>{ sfx('select'); socket.emit('game:vote',{idx:+el.dataset.i}); });
}

function hintHTML(h, showKo){
  return `<span class="hintword"><span class="w">${esc(h.word)}</span><span class="num">${h.num}</span>${showKo&&h.ko?`<span class="ko">${esc(h.ko)}</span>`:''}</span>
    <button class="spk" onclick="speak('${esc(h.word)}. ${h.num}.',.85)">🔈</button>`;
}
function renderMsg(g){
  const me=g.me, myTurn=me.team===g.turn; let h;
  if(g.phase==='over'){
    h = peek ? '🃏 <b>전체 카드</b>를 보고 있어요!' : (g.winner?`🏁 <b>${teamName(g.winner)}</b> 승리!`:'🏁 게임이 끝났어요');
  } else if(g.phase==='hint'){
    if(myTurn && me.role==='spy') h='🔑 <b>힌트 담당!</b> 영어 힌트와 숫자를 골라 보내세요.';
    else h=`<span class="tagteam ${g.turn}">${teamName(g.turn)}</span> 힌트 담당이 생각 중이에요<span class="dots"></span>`;
  } else {
    const showKo = g.showHintKo || me.role==='spy';
    h = `<span class="tagteam ${g.turn}">${g.turn==='blue'?'파랑':'빨강'} 힌트</span> ${hintHTML(g.hint, showKo)}`;
  }
  $('#gMsg').innerHTML=`<div class="${g.phase==='guess'?'':'txt'}">${h}</div>`;
}

function renderActions(g){
  const a=$('#gAct'), me=g.me, myTurn=me.team===g.turn;
  removeHintPad();
  if(g.phase==='over'){
    a.innerHTML = peek ? `<button class="gbtn" id="unpeek">🏁 결과 다시 보기</button><div class="note" id="nextCount2"></div>` : '';
    if(peek) $('#unpeek').onclick=()=>{ peek=false; renderBoard(g); renderMsg(g); renderActions(g); showEnd(g, true); };
    return;
  }
  if(g.phase==='hint' && myTurn && me.role==='spy'){
    a.innerHTML = `<button class="gbtn" id="hpToggle">🔑 힌트 고르기</button>`;
    $('#hpToggle').onclick=()=>{ hintOpen=!hintOpen; renderBoard(g); renderActions(g); };
    if(hintOpen) renderHintPad(g);
    return;
  }
  if(g.phase==='guess' && myTurn && me.role==='agent'){
    const myPass = g.passVotes.includes(S.me.name);
    a.innerHTML = `<div class="note">카드를 눌러요! 친구 <b style="color:var(--gold)">${g.need}</b>명이 같은 카드를 누르면 열려요</div>
      <button class="dbtn ${myPass?'goldb':''}" id="passBtn" ${g.guessed<1?'disabled':''}>✋ 턴 끝내기 (${g.passVotes.length}/${g.need})</button>`;
    $('#passBtn').onclick=()=>{ beep('tap'); socket.emit('game:pass'); };
    return;
  }
  if(me.role==='spy' && myTurn) { a.innerHTML='<div class="note">🤫 힌트 담당은 말하지 않고 지켜봐요!<br>요원들이 카드를 고르고 있어요.</div>'; return; }
  a.innerHTML = `<div class="note">${myTurn?'기다려 주세요…':`<b style="color:${g.turn==='blue'?'#7cc8ff':'#ff8f99'}">${teamName(g.turn)}</b> 차례예요.<br>힌트를 같이 들어 보세요!`}</div>`;
}

function removeHintPad(){ $('#hintpad')?.remove(); }
function renderHintPad(g){
  const pad=document.createElement('div');
  pad.id='hintpad'; pad.className='abs gpanel hintpad';
  const open=g.cards.filter(c=>!c.revealed);
  const groups={};
  g.hints.forEach(h=>{ (groups[h.g]=groups[h.g]||[]).push(h); });
  const mine = h => open.filter(c=>c.color===g.me.team && c.tags.includes(h.w)).length;
  pad.innerHTML = `<h3 class="bhs">🔑 비밀 힌트 전송 <small>고르면 연결된 카드가 반짝여요 · 도깨비 카드를 조심!</small></h3>
    <div class="hp-groups">${Object.entries(groups).map(([gn,hs])=>`<div class="hp-row"><span class="gl">${gn}</span>${hs.map(h=>`<button class="hchip ${spyPick.w===h.w?'sel':''}" data-w="${esc(h.w)}">${esc(h.w)}<small>${esc(h.ko)}</small>${mine(h)?`<span class="cnt">우리 ${mine(h)}</span>`:''}</button>`).join('')}</div>`).join('')}</div>
    <div class="hp-bottom">연결할 카드 수 ${[1,2,3,4].map(n=>`<button class="numbtn ${spyPick.n===n?'sel':''}" data-n="${n}">${n}</button>`).join('')}
      <button class="gbtn" id="sendHint" style="margin-left:14px" ${spyPick.w&&spyPick.n?'':'disabled'}>📨 힌트 공개하기</button>
      <button class="dbtn" id="hideHint" style="height:58px;padding:0 18px;font-size:19px">카드 보기 ▼</button></div>`;
  $('#game').appendChild(pad);
  const rer=()=>{ renderBoard(S.game); renderActions(S.game); };
  pad.querySelectorAll('.hchip').forEach(b=>b.onclick=()=>{ spyPick.w=b.dataset.w; beep('tap'); speak(b.dataset.w,.85); rer(); });
  pad.querySelectorAll('.numbtn').forEach(b=>b.onclick=()=>{ spyPick.n=+b.dataset.n; beep('tap'); rer(); });
  pad.querySelector('#sendHint').onclick=()=>{ sfx('confirm'); socket.emit('game:hint',{word:spyPick.w,num:spyPick.n}); spyPick={w:null,n:null}; };
  pad.querySelector('#hideHint').onclick=()=>{ hintOpen=false; rer(); };
}

// ---------- 이벤트 (힌트·카드 공개) ----------
let popQ=[], popping=false;
function handleEvents(g){
  const evs=g.events.filter(e=>e.seq>lastSeq.seq);
  if(!evs.length) return;
  lastSeq.seq=Math.max(...evs.map(e=>e.seq));
  evs.forEach(e=>{
    if(e.type==='hint'){ sfx('hint'); setTimeout(()=>speak(`${e.word}. ${e.num}.`,.85),250); }
    else if(e.type==='turn'){ sfx('notify'); }
    else if(e.type==='timeout'){ sfx('timer'); toast('⏰ 시간이 다 되어 차례가 넘어가요!'); }
    else if(e.type==='pass'){ toast(`✋ ${teamName(e.team)}이 턴을 끝냈어요.`); }
    else if(e.type==='reveal'){ const c=g.cards[e.idx]; if(c) popQ.push({e,c}); }
  });
  nextPop();
}
function closeReveal(){ $('#revealLayer').classList.add('hidden'); popping=false; popQ=[]; }
function nextPop(){
  if(popping||!popQ.length) return;
  popping=true;
  const {e,c}=popQ.shift();
  const resText={hit:`정답! ${teamName(e.team)} 카드`, enemy:`상대 팀 카드! 차례가 넘어가요`, neutral:`마을 사람 카드! 차례가 넘어가요`, assassin:`도깨비 카드! ${teamName(e.team)} 패배`}[e.result];
  const resImg = EMB[e.color] || EMB.neutral;
  sfx(e.color==='assassin'?'goblin':e.color==='blue'?'blue':e.color==='red'?'red':'neutral');
  const L=$('#revealLayer');
  L.innerHTML=`<div class="gpanel pop reveal-pop ${e.team}">
    <img class="ph" src="${cardImg(c)}" alt="">
    <div class="w">${esc(c.en)}<small>${esc(c.ko)}</small></div>
    <div class="q">Do you know about ${esc(c.en)}?</div><div class="a">${esc(c.a)}</div>
    <span class="res ${e.result}"><img src="${resImg}" alt="">${resText}</span>
    ${e.by&&e.by.length?`<div class="by">고른 요원: ${e.by.map(esc).join(', ')}</div>`:''}</div>`;
  L.classList.remove('hidden');
  try{ speechSynthesis.cancel(); }catch(err){}
  speak(`Do you know about ${c.en}? ... ${c.a}`, .9);
  const close=()=>{ if(!popping) return; L.classList.add('hidden'); popping=false; nextPop(); };
  L.onclick=close;
  setTimeout(close, popQ.length?2600:5200);
}

// ---------- 승리·패배 화면 ----------
let endShownFor=-1;
function teamStats(g,t){
  const o=t==='red'?'blue':'red';
  return {
    found: g.cards.filter(c=>c.revealed && c.color===t).length,
    total: g.total[t],
    neutral: g.cards.filter(c=>c.revealed && c.by===t && c.color==='neutral').length,
    enemy: g.cards.filter(c=>c.revealed && c.by===t && c.color===o).length,
    goblin: g.cards.filter(c=>c.revealed && c.by===t && c.color==='assassin').length
  };
}
function etiles(g,t){
  return teamList(g,t).map((p,i)=>`<div class="etile ${p.id===S.me.id?'me':''}"><img src="${p.ai?EMB[t]:avatar(t,i)}" alt="" ${p.ai?'style="object-fit:contain;padding:10px;background:#0b1424"':''}>${p.spy?'<span class="tag">🔑 힌트</span>':''}<div class="nm">${esc(p.name)}</div></div>`).join('');
}

          <div class="sp-side red ${w==='red'?'win':''}" style="flex-direction:row-reverse;text-align:right"><img src="${EMB.red}" alt=""><div><div class="tn" style="color:#ff8f99">빨간 팀</div><div class="big">${sr.found}<small>/${sr.total}장</small></div></div></div>

function hideEnd(){ const was=!$('#endLayer').classList.contains('hidden'); $('#endLayer').classList.add('hidden'); if(was && $('#game').classList.contains('on')) playBgm('game'); }
function confetti(t){

}

// ---------- 시간 ----------
function tickTimer(){
  const r=$('#gBoxR');
  if(r){
    if(S&&S.game&&S.game.phase==='over'){ r.innerHTML=`<div class="l">작전 종료</div><div class="v small">🏁</div>`; }
    else if(endAt){ const s=Math.max(0,Math.ceil((endAt-Date.now())/1000)); const tk=endAt+'|'+s; if(s===10 && tickTimer.warn!==endAt){ tickTimer.warn=endAt; sfx('timer'); } r.innerHTML=`<div class="l">남은 시간</div><div class="v ${s<=10?'warn':''}">${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</div>`; }
    else r.innerHTML=`<div class="l">남은 시간</div><div class="v">∞</div>`;
  }
  if(nextAt){ const left=Math.ceil((nextAt-Date.now())/1000); if(left===3 && tickTimer.cd!==nextAt){ tickTimer.cd=nextAt; sfx('countdown'); } }
  const txt = nextAt ? `⏳ ${Math.max(0,Math.ceil((nextAt-Date.now())/1000))}초 뒤 새 게임 (역할 바뀜)` : '선생님이 다음 판을 시작해요';
  const nc=$('#nextCount'), nc2=$('#nextCount2');
  if(nc) nc.textContent=txt; if(nc2) nc2.textContent=txt;
}
setInterval(tickTimer,250);

// ---------- 최종 순위 ----------
function renderFinal(){
  show('final'); hideEnd(); closeReveal(); removeHintPad();
  const rk=S.ranking||[];
  const p=[rk[1],rk[0],rk[2]], cls=['p2','p1','p3'];
  $('#podium').innerHTML=p.map((r,i)=>r?`<div class="pod ${cls[i]}">${cls[i]==='p1'?'<div class="crown">👑</div>':''}<div class="nm">${esc(r.name)}</div><div class="sc">${r.score}점</div><div class="bar">${r.rank}</div></div>`:'').join('');
  $('#finalList').innerHTML=rk.map(r=>`<div class="rrow ${r.id===S.me.id?'me':''}"><span class="rk">${r.rank}</span><span class="nm">${esc(r.name)}</span><span class="sub">${r.wins}승 · 정답 ${r.correct}</span><span class="sc">${r.score}</span></div>`).join('')
    + `<div style="text-align:center;font-size:22px;margin-top:16px;color:#fff">${esc(S.me.name)} 요원은 <b style="color:var(--gold)">${S.me.rank}위</b>! 수고했어요 👏</div>`;
  if(!renderFinal.done){ renderFinal.done=true; sfx('victory'); }
}

// =============================================================
//  교사
// =============================================================
function goTeacher(){
  closePop();
  if(session.mode==='teacher' && session.token){
    socket.emit('teacher:resume',{code:session.code,token:session.token},res=>{ if(res.ok) enterTeacher(); else createClass(); });
  } else createClass();
}
function enterTeacher(){ document.body.classList.add('teacher-mode'); document.documentElement.classList.add('teacher-mode'); }
function createClass(){
  socket.emit('teacher:create',{},res=>{ if(res.ok){ session={mode:'teacher',code:res.code,token:res.token}; LS.set('codek',session); enterTeacher(); } });
}
$('#tNew').onclick=()=>{ if(confirm('새 교실을 만들까요? 지금 교실의 학생들은 새 코드로 다시 들어와야 해요.')) createClass(); };
$('#tHome').onclick=()=>{ document.body.classList.remove('teacher-mode'); document.documentElement.classList.remove('teacher-mode'); show('title'); fit(); };
$('#tHow').onclick=()=>{ document.body.classList.remove('teacher-mode'); document.documentElement.classList.remove('teacher-mode'); fit(); howto(); const L=$('#popLayer'); const back=()=>{ if(session.mode==='teacher') enterTeacher(); }; L.addEventListener('click',function h(e){ if(e.target===L||e.target.closest('.gbtn')){ L.removeEventListener('click',h); back(); } }); };
const tEmit=(ev,d)=>socket.emit(ev,d||{},()=>{});
$('#bAssign').onclick=()=>{ tEmit('teacher:assign'); toast('모둠을 새로 배정했어요.'); };
$('#bStart').onclick=()=>tEmit('teacher:startAll');
$('#bNext').onclick=()=>{ if(confirm('모든 모둠이 지금 판을 멈추고 새 판을 시작해요.')) tEmit('teacher:nextAll'); };
$('#bEnd').onclick=()=>{ if(confirm('게임을 끝내고 학생 화면에 최종 순위를 보여 줄까요?')) tEmit('teacher:endAll'); };
$('#bLobby').onclick=()=>tEmit('teacher:lobby');
$('#bReset').onclick=()=>{ if(confirm('모든 학생의 점수와 랭킹을 0으로 되돌릴까요?')) tEmit('teacher:resetRank'); };
$('#sUnit').onchange=e=>tEmit('teacher:settings',{unit:e.target.value});
$('#sGroup').onchange=e=>tEmit('teacher:settings',{groupSize:+e.target.value});
$('#sTime').onchange=e=>tEmit('teacher:settings',{turnTime:+e.target.value});
$('#sKo').onchange=e=>tEmit('teacher:settings',{showHintKo:e.target.checked});
$('#sAuto').onchange=e=>tEmit('teacher:settings',{autoNext:e.target.checked});

socket.on('tstate', st=>{ TS=st; renderTeacher(); });
const mmss = ms => { const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function renderTeacher(){
  const t=TS;
  $('#tCode').textContent=t.code; $('#tUrl').textContent=location.host;
  $('#tState').innerHTML={lobby:'<span style="color:#ffd76a">대기 중</span>',playing:'<span style="color:#5ef08f">게임 진행 중</span>',ended:'<span style="color:#ff8f99">순위 발표 중</span>'}[t.state];
  if(document.activeElement!==$('#sUnit')) $('#sUnit').innerHTML=t.units.map(u=>`<option value="${u.key}" ${u.key===t.settings.unit?'selected':''}>${esc(u.title)}</option>`).join('');
  $('#sGroup').value=String(t.settings.groupSize); $('#sTime').value=String(t.settings.turnTime);
  $('#sKo').checked=t.settings.showHintKo; $('#sAuto').checked=t.settings.autoNext;
  const on=t.students.filter(s=>s.connected).length;
  $('#tOn').textContent=`${on}명 / 전체 ${t.students.length}명`; $('#tGcnt').textContent=`${t.groups.length}모둠`;
  $('#tStuTitle').textContent=`학생 접속 현황 (${on}명)`;
  $('#tStudents').innerHTML=t.students.map((s,i)=>`<div class="srow ${s.connected?'':'off'}"><span class="dot"></span>${esc(s.name)} <span class="g">${esc(s.group||'')}</span><button class="x" data-kick="${s.id}" title="내보내기">✕</button></div>`).join('')||'<div style="color:var(--muted)">학생들이 6자리 코드로 들어오길 기다리는 중…</div>';
  $$('[data-kick]').forEach(b=>b.onclick=()=>{ if(confirm('이 학생을 교실에서 내보낼까요?')) tEmit('teacher:kick',{id:b.dataset.kick}); });
  $('#tGroups').innerHTML=t.groups.map(gr=>{
    const g=gr.game;
    const names=gr.members.map(m=>esc(m.name)).join(', ');
    if(!g) return `<div class="tp"><div class="gh"><span class="nm">📋 ${esc(gr.name)}</span><span class="badge gray">대기</span></div><div style="font-size:16px;color:#dfe5f0">${names||'학생 없음'}</div></div>`;
    const team=tt=>`<div class="${tt}"><b style="color:${tt==='blue'?'#7cc8ff':'#ff8f99'}">${tt==='blue'?'파란 팀':'빨간 팀'} · 남은 ${g.left[tt]}장</b><br>🔑 ${esc(g.teams[tt].spy.name)}<br>🕵️ ${g.teams[tt].members.map(m=>esc(m.name)).join(', ')||'AI 요원'}</div>`;
    const st = g.phase==='over' ? (g.winner?`<span class="badge ${g.winner}">${g.winner==='red'?'빨간 팀':'파란 팀'} 승리${g.reason==='assassin'?' (도깨비)':''}</span>`:'<span class="badge gray">멈춤</span>')
      : `<span class="badge ${g.turn}">${g.turn==='red'?'빨간 팀':'파란 팀'} 차례</span> <span style="font-size:14px;color:#dfe5f0">${g.phase==='hint'?'힌트 생각 중':`힌트 <b style="color:var(--gold)">${esc(g.hint.word)} ${g.hint.num}</b>`}</span>`;
    const log=(g.log||[]).map(l=>`<div><span class="badge ${l.team}" style="padding:0 6px">${l.team==='blue'?'파랑':'빨강'}</span> <b style="color:var(--gold)">${esc(l.word)} ${l.num}</b> → ${l.picks.map(p=>`<span class="pk ${p.color===l.team?'ok':p.color==='assassin'?'as':p.color==='neutral'?'ne':'no'}">${esc(p.ko)}</span>`).join(' ')||'<span style="color:var(--muted)">고르는 중</span>'}</div>`).join('');
    return `<div class="tp"><div class="gh"><span class="nm">📋 ${esc(gr.name)}</span><span style="font-size:13px;color:var(--muted)">${g.no}번째 판 · ${mmss(g.elapsed||0)}</span> ${st}</div>
      <div class="gteams">${team('blue')}${team('red')}</div>
      <div class="mini">${g.cards.map(c=>`<div class="c-${c.color} ${c.revealed?'o':''}" title="${esc(c.ko)}"><img src="${cardImg(c)}" alt="" loading="lazy"><span>${esc(c.ko)}</span></div>`).join('')}</div>
      ${log?`<div class="glog">${log}</div>`:''}</div>`;
  }).join('') || `<div class="tp empty-guide"><h3><span class="ic">🧭</span> 시작 방법</h3>① 학생들에게 <b style="color:var(--gold)">교실 코드 6자리</b>를 알려 주세요.<br>② 모두 들어오면 <b>🔀 모둠 자동 배정</b> → <b>▶ 전체 게임 시작</b>.<br><br>모둠 안에서 파란·빨간 팀과 힌트 담당은 자동으로 정해지고 판마다 바뀌어요. 인원이 모자란 팀은 AI가 힌트 담당을 맡아요.</div>`;
  $('#tRank').innerHTML=t.ranking.slice(0,40).map(r=>`<div class="trow"><span class="rk">${r.rank}</span><span class="nm">${esc(r.name)}</span><span class="sub">${r.wins}승·정답${r.correct}</span><span class="sc">${r.score}</span></div>`).join('')||'<div style="color:var(--muted)">아직 점수가 없어요.</div>';
}

// ---------- 다시 연결 ----------
socket.on('connect',()=>{
  if(session.mode==='student' && session.sid) rejoin();
  else if(session.mode==='teacher' && session.token) socket.emit('teacher:resume',{code:session.code,token:session.token},res=>{ if(res.ok) enterTeacher(); else { session={}; LS.del('codek'); } });
});
socket.on('disconnect',()=>toast('연결이 끊겼어요. 다시 연결하는 중…',4000));
</script>
</body>
</html>
